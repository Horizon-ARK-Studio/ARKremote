<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ARKlight Remote</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="status" class="status">connecting…</div>

  <svg id="remote" viewBox="0 0 320 1140" xmlns="http://www.w3.org/2000/svg">
    <!-- body -->
    <rect x="6" y="6" width="308" height="1128" rx="38" class="body"/>

    <!-- power -->
    <g class="btn round" data-hid="POWER" data-cx="252" data-cy="56" data-r="30">
      <circle cx="252" cy="56" r="30"/>
      <path class="ic" d="M252 40v18M241 46a16 16 0 1 0 22 0" fill="none" stroke-width="3.4" stroke-linecap="round"/>
    </g>

    <!-- top row: TV / input, wrench -- all remappable macro slots, default F1-F3 -->
    <g class="btn round" data-hid="TV" data-cx="66" data-cy="150" data-r="28"><circle cx="66" cy="150" r="28"/><text x="66" y="155" class="lbl">TV</text></g>
    <g class="btn round" data-hid="INPUT" data-cx="66" data-cy="230" data-r="26"><circle cx="66" cy="230" r="26"/><path class="ic" d="M56 230h20M66 220v20" stroke-width="3" stroke-linecap="round"/></g>
    <g class="btn round" data-hid="WRENCH" data-cx="252" data-cy="150" data-r="28"><circle cx="252" cy="150" r="28"/><path class="ic" d="M244 150a8 8 0 1 1 16 0 8 8 0 0 1-16 0M252 134v-6M252 172v6M268 150h6M230 150h6" stroke-width="2.6" stroke-linecap="round" fill="none"/></g>
    <g class="btn pill" data-hid="MENU" data-cx="252" data-cy="230"><rect x="214" y="212" width="76" height="36" rx="18"/><text x="252" y="235" class="lbl">MENU</text></g>

    <!-- d-pad -->
    <circle cx="160" cy="450" r="150" class="dpad-ring"/>
    <g class="btn arrow" data-hid="UP"><path d="M160 320 l22 34 h-44 z"/></g>
    <g class="btn arrow" data-hid="DOWN"><path d="M160 580 l-22 -34 h44 z"/></g>
    <g class="btn arrow" data-hid="LEFT"><path d="M30 450 l34 -22 v44 z"/></g>
    <g class="btn arrow" data-hid="RIGHT"><path d="M290 450 l-34 22 v-44 z"/></g>
    <g class="btn round ok" data-hid="OK" data-cx="160" data-cy="450" data-r="58"><circle cx="160" cy="450" r="58"/><circle cx="160" cy="450" r="4" class="crosshair"/></g>

    <!-- back / home -->
    <g class="btn round" data-hid="BACK" data-cx="66" data-cy="640" data-r="30"><circle cx="66" cy="640" r="30"/><path class="ic" d="M76 628a16 16 0 1 0-2 24M56 620v10h10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <g class="btn round" data-hid="HOME" data-cx="252" data-cy="640" data-r="30"><circle cx="252" cy="640" r="30"/><path class="ic" d="M236 642l16-13 16 13v14a3 3 0 0 1-3 3h-8v-12h-10v12h-8a3 3 0 0 1-3-3z" stroke-width="1.5" fill="var(--ic)"/></g>

    <!-- volume rocker -->
    <g class="rocker" transform="translate(30,700)">
      <rect width="72" height="150" rx="34" class="rocker-bg"/>
      <g class="btn rocker-half" data-hid="VOL_UP"><rect width="72" height="75" rx="0"/><text x="36" y="30" class="lbl">+</text></g>
      <g class="btn rocker-half" data-hid="VOL_DOWN" transform="translate(0,75)"><rect width="72" height="75" rx="0"/><text x="36" y="48" class="lbl">−</text></g>
      <text x="36" y="90" class="lbl small">VOL</text>
    </g>

    <!-- mic + mute -->
    <g class="btn round" data-hid="MIC" data-cx="160" data-cy="730" data-r="30"><circle cx="160" cy="730" r="30"/><path class="ic" d="M160 712a10 10 0 0 1 10 10v10a10 10 0 0 1-20 0v-10a10 10 0 0 1 10-10zM148 734a12 12 0 0 0 24 0M160 746v8" stroke-width="2.6" stroke-linecap="round" fill="none"/></g>
    <g class="btn round" data-hid="MUTE" data-cx="160" data-cy="808" data-r="28"><circle cx="160" cy="808" r="28"/><path class="ic" d="M144 800h8l12-10v36l-12-10h-8zM172 796l14 16M186 796l-14 16" stroke-width="2.4" stroke-linecap="round" fill="none"/></g>

    <!-- channel rocker -->
    <g class="rocker" transform="translate(218,700)">
      <rect width="72" height="150" rx="34" class="rocker-bg"/>
      <g class="btn rocker-half" data-hid="CH_UP"><rect width="72" height="75" rx="0"/><text x="36" y="30" class="lbl">+</text></g>
      <g class="btn rocker-half" data-hid="CH_DOWN" transform="translate(0,75)"><rect width="72" height="75" rx="0"/><text x="36" y="48" class="lbl">−</text></g>
      <text x="36" y="90" class="lbl small">CH</text>
    </g>

    <!-- settings / play-pause / options -->
    <g class="btn round" data-hid="GEAR" data-cx="66" data-cy="880" data-r="26"><circle cx="66" cy="880" r="26"/><path class="ic" d="M66 868a12 12 0 1 0 0 24 12 12 0 0 0 0-24z" stroke-width="2.4" fill="none"/></g>
    <g class="btn round" data-hid="PLAY_PAUSE" data-cx="160" data-cy="880" data-r="28"><circle cx="160" cy="880" r="28"/><path class="ic" d="M150 868v24M158 868v24M172 868l14 12-14 12z" fill="var(--ic)" stroke="none"/></g>
    <g class="btn round" data-hid="OPTIONS" data-cx="252" data-cy="880" data-r="26"><circle cx="252" cy="880" r="26"/><rect x="240" y="871" width="24" height="3" class="ic" rx="1.5"/><rect x="240" y="879" width="24" height="3" class="ic" rx="1.5"/><rect x="240" y="887" width="24" height="3" class="ic" rx="1.5"/></g>

    <!-- the 6 preset app buttons: no Consumer usage launches a named app, so these
         default onto remappable F7-F12 macro slots, same as the other non-standard
         buttons above. Long-press any of them to point it at a different key. -->
    <g class="app-row">
      <g class="btn app-pill" data-hid="APP_SONYLIV" transform="translate(24,930)"><rect width="128" height="40" rx="20"/><text x="64" y="25" class="lbl small">SonyLIV</text></g>
      <g class="btn app-pill" data-hid="APP_NETFLIX" transform="translate(168,930)"><rect width="128" height="40" rx="20"/><text x="64" y="25" class="lbl small">Netflix</text></g>
      <g class="btn app-pill" data-hid="APP_DISNEY" transform="translate(24,982)"><rect width="128" height="40" rx="20"/><text x="64" y="25" class="lbl small">Disney+</text></g>
      <g class="btn app-pill" data-hid="APP_PRIME" transform="translate(168,982)"><rect width="128" height="40" rx="20"/><text x="64" y="25" class="lbl small">Prime Video</text></g>
      <g class="btn app-pill" data-hid="APP_YOUTUBE" transform="translate(24,1034)"><rect width="128" height="40" rx="20"/><text x="64" y="25" class="lbl small">YouTube</text></g>
      <g class="btn app-pill" data-hid="APP_MUSIC" transform="translate(168,1034)"><rect width="128" height="40" rx="20"/><text x="64" y="25" class="lbl small">Music</text></g>
    </g>

    <text x="160" y="1110" class="brand">ARKLIGHT REMOTE</text>
  </svg>

  <script src="app.js"></script>
</body>
</html>
